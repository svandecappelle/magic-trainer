# nginx site for Magic Trainer, installed by "make install" as its own file (magic-trainer.host.conf):
# it never touches other sites. The domain, port and paths in capitals between underscores are filled in by the installer.
# Names below (map variable, upstream) are prefixed so they can't clash with other configurations.
# HTTPS: used once /etc/letsencrypt has a certificate for the domain (make https).
# "Connection: upgrade" only for WebSocket requests.
map $http_upgrade $magic_trainer_connection {
    default upgrade;
    ''      close;
}

upstream magic_trainer_backend {
    server 127.0.0.1:__PORT__;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Let's Encrypt HTTP challenge (certbot certonly --webroot), answered from this site's own folder.
    location /.well-known/acme-challenge/ {
        root __WEBROOT__;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate     __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    # Spelled out rather than included from /etc/letsencrypt: options-ssl-nginx.conf only exists when certbot's
    # nginx plugin wrote it, and including a missing file stops nginx from starting.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:MagicTrainerSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Decklists and game states are small; nothing big is ever uploaded.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Multiplayer: WebSocket at /ws. Long timeouts so idle games aren't cut
    # (the server pings every 30 s, which also keeps the connection alive).
    location /ws {
        proxy_pass http://magic_trainer_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $magic_trainer_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # The app (static files; unknown paths fall back to index.html for client-side routes).
    location / {
        proxy_pass http://magic_trainer_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have content hashes in their names: cache them for a long time.
    location /assets/ {
        proxy_pass http://magic_trainer_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
