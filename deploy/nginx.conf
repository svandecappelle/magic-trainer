# nginx in front of Magic Trainer (docker compose up -d → listening on 127.0.0.1:8787).
# Copy to /etc/nginx/sites-available/magic-trainer, replace magic.example.com, then:
#   sudo ln -s /etc/nginx/sites-available/magic-trainer /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d magic.example.com     # HTTPS (Let's Encrypt), edits this file for you

# "Connection: upgrade" only for WebSocket requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream magic_trainer {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name magic.example.com;

    # Decklists and game states are small; nothing big is ever uploaded.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Multiplayer: WebSocket at /ws. Long timeouts so idle games aren't cut
    # (the server pings every 30 s, which also keeps the connection alive).
    location /ws {
        proxy_pass http://magic_trainer;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # The app (static files; unknown paths fall back to index.html for client-side routes).
    location / {
        proxy_pass http://magic_trainer;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have content hashes in their names: cache them for a long time.
    location /assets/ {
        proxy_pass http://magic_trainer;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
